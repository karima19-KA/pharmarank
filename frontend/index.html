<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tableau de bord — MediRank</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
</head>
<body>
<div class="app-shell">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="main main-dashboard">
    <div class="topbar">
      <div>
        <h1 id="pageTitle" class="hero-title">Bonjour <span class="accent">Admin</span> <span class="hero-wave">👋</span></h1>
        <p class="subtitle">Vue d'ensemble des pharmacies et candidats indexés</p>
      </div>
      <div class="dash-filter-bar">
        <select id="secteurFilter" class="choice-select">
          <option value="">Tous secteurs</option>
        </select>
        <select id="sizeFilter" class="choice-select">
          <option value="">Toutes tailles</option>
          <option value="0-100">&lt; 100 employés</option>
          <option value="100-1000">100 – 1000 employés</option>
          <option value="1000-999999">1000+ employés</option>
        </select>
        <button class="btn-export" id="exportBtn"></button>
      </div>
    </div>

    <div class="kpi-grid kpi-grid-4" id="kpiGrid">
      <div class="card loading">Chargement…</div>
    </div>

    <div class="bento-grid">
      <div class="card compact bento-1">
        <div class="section-title">Top 10 pharmacies</div>
        <canvas id="topChart"></canvas>
      </div>
      <div class="card compact bento-1">
        <div class="section-title">Meilleure pharmacie</div>
        <div id="topPharmacyCard" class="bento-scroll"><div class="loading">Chargement…</div></div>
      </div>
      <div class="card compact bento-1">
        <div class="section-title">Répartition secteur</div>
        <canvas id="sectorChart"></canvas>
      </div>
      <div class="card compact bento-1">
        <div class="section-title">Top 15 effectif</div>
        <canvas id="employeeCountChart"></canvas>
      </div>

      <div class="card compact bento-1">
        <div class="section-title">Top 10 villes</div>
        <canvas id="citiesChart"></canvas>
      </div>
      <div class="card compact bento-1">
        <div class="section-title">Par séniorité</div>
        <canvas id="seniorityChart"></canvas>
      </div>
      <div class="card compact bento-1">
        <div class="section-title">Embauches / mois <span class="hint">éch. limité</span></div>
        <canvas id="hiringTrendChart"></canvas>
      </div>
      <div class="card compact bento-1 bento-compare">
        <div class="section-title">Comparer laboratoires</div>
        <div class="tag-select-wrap">
          <div class="tag-select-box" id="compareTagBox">
            <input type="text" class="tag-select-input" id="compareInput" placeholder="Ajouter…">
          </div>
          <div class="tag-suggest-dropdown" id="compareSuggestions" style="display:none"></div>
        </div>
        <canvas id="compareChart"></canvas>
      </div>
    </div>
  </main>
</div>

<script src="assets/js/icons.js"></script>
<script src="assets/js/common.js"></script>
<script src="assets/js/dashboard.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:,">
<title>Candidats — MediRank</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="app-shell">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="main">
    <div class="topbar">
      <div>
        <h1>Candidats</h1>
        <p class="subtitle">Classement des profils scrapés — affinez avec les filtres si besoin</p>
      </div>
    </div>

    <div class="card compact" style="margin-bottom:12px">
      <div class="filter-bar" style="grid-template-columns:1fr 1fr 1fr auto">
        <div>
          <label class="field-label">Expérience min. (années)</label>
          <input id="expInput" class="field" type="number" min="0" step="0.5" placeholder="0">
        </div>
        <div>
          <label class="field-label">Ville</label>
          <select id="villeSelect" class="field"><option value="">Toutes</option></select>
        </div>
        <div>
          <label class="field-label">Pharmacie</label>
          <select id="companySelect" class="field"><option value="">Toutes</option></select>
        </div>
        <button class="btn" id="searchBtn">Filtrer</button>
      </div>
    </div>

    <div class="card" style="padding:0;overflow:hidden">
      <div style="overflow-x:auto">
        <table>
          <thead>
            <tr>
              <th>Candidat</th><th>Poste actuel</th><th>Pharmacie</th>
              <th>Ville</th><th>Expérience</th><th>Statut</th><th>Score</th>
            </tr>
          </thead>
          <tbody id="candTbody">
            <tr><td colspan="7" class="loading">Chargement…</td></tr>
          </tbody>
        </table>
      </div>
      <div class="table-footer" id="tableFooter"></div>
    </div>

    <div id="detailOverlay" class="detail-overlay" style="display:none">
      <div id="detailPanel" class="card detail-modal"></div>
    </div>
  </main>
</div>

<script src="assets/js/icons.js"></script>
<script src="assets/js/common.js"></script>
<script src="assets/js/candidates.js"></script>
</body>
</html>
